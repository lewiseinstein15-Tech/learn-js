<!DOCTYPE html>
<p>select day and enter task</p>
<form>
    
<input list="days" id="day" placeholder="pick day" >
<datalist id="days">
    <option value="mon"></option>
    <option value="tue"></option>
    <option value="wed"></option>
    <option value="thur"></option>
    <option value="fri"></option>
     <option value="sat"></option>
    <option value="sun"></option>

</datalist>
<input type="text" id="task" placeholder="add new task">
<button type="submit" onclick="addtask()">send</button>
</form>
